spring:
  application:
    name: mini-api-gateway
  profiles:
    active: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mini_api_gateway}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    # open-in-view defaults to true in Spring Boot, which lets the persistence session
    # stay open through view rendering. That's how N+1 queries hide in controllers and
    # only show up as a production performance incident. Off, always.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate is only ever allowed to validate that the
      # entity mappings agree with what Flyway created - never to generate DDL itself.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Actuator is exposed narrowly on purpose: health and info only. Every additional endpoint
# (env, beans, mappings, etc.) is a potential information disclosure surface and gets
# enabled explicitly, per-profile, only when there's a concrete need for it.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
